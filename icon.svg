<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Stitch Studio app icon: warm cream background with a hex granny motif -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ede3"/>
      <stop offset="1" stop-color="#e8d4b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Three concentric hexagonal rings, evoking a hex granny -->
  <g transform="translate(256 256)" stroke-linejoin="round">
    <!-- Outer ring -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="#8b5e3c" stroke="#6e3018" stroke-width="6"/>
    <!-- Middle ring -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="#d4956a" stroke="#8b5e3c" stroke-width="5"/>
    <!-- Inner core -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
             fill="#3d8b7a" stroke="#245e50" stroke-width="4"/>
    <!-- Centre dot -->
    <circle r="14" fill="#fdf0e6"/>
  </g>
</svg>
